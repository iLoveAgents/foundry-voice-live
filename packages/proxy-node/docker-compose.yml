version: "3.8"

services:
  foundry-voice-live-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foundry-voice-live-proxy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Server Configuration
      - PORT=8080
      # Voice Live API version. Leave unset for the built-in defaults (2026-07-15 GA for
      # WebSocket, 2026-01-01-preview for ?transport=webrtc); pinning it here applies to both
      # transports. Clients can override per connection with ?apiVersion=
      - API_VERSION=${API_VERSION:-}

      # Foundry Configuration (Required)
      - FOUNDRY_RESOURCE_NAME=${FOUNDRY_RESOURCE_NAME}

      # Standard Mode: Voice & Avatar (Optional - falls back to DefaultAzureCredential when unset)
      - FOUNDRY_API_KEY=${FOUNDRY_API_KEY}

      # Foundry Agents (Optional - .env fallback for agentName/projectName URL params)
      - FOUNDRY_AGENT_NAME=${FOUNDRY_AGENT_NAME}
      - FOUNDRY_PROJECT_NAME=${FOUNDRY_PROJECT_NAME}

      # Security Configuration
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - MAX_CONNECTIONS=${MAX_CONNECTIONS:-1000}

      # Telemetry (Optional)
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - foundry-voice-live-network

networks:
  foundry-voice-live-network:
    driver: bridge
