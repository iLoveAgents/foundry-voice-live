services:
  foundry-voice-live-proxy:
    build:
      context: ../..
      dockerfile: packages/proxy-node/Dockerfile
    container_name: foundry-voice-live-proxy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Server Configuration
      - PORT=8080
      - API_VERSION=${API_VERSION:-2026-07-15}

      # Foundry Configuration (Required)
      - FOUNDRY_RESOURCE_NAME=${FOUNDRY_RESOURCE_NAME}

      # Standard Mode: Voice & Avatar (Optional)
      - FOUNDRY_API_KEY=${FOUNDRY_API_KEY:-}

      # Foundry Agent defaults (Optional)
      - FOUNDRY_AGENT_NAME=${FOUNDRY_AGENT_NAME:-}
      - FOUNDRY_PROJECT_NAME=${FOUNDRY_PROJECT_NAME:-}

      # Service principal / user-assigned managed identity (Optional)
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}

      # Security Configuration
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - MAX_CONNECTIONS=${MAX_CONNECTIONS:-1000}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - foundry-voice-live-network

networks:
  foundry-voice-live-network:
    driver: bridge
