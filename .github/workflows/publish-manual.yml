name: Publish to npm (Manual)

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - all
          - react
          - proxy-node
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC identity for npm Trusted Publishing (no NPM_TOKEN)
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version from packageManager in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          # No `registry-url`: it makes setup-node write an .npmrc pointing at
          # ${NODE_AUTH_TOKEN} and export that variable with a placeholder value, so npm
          # authenticates with a bogus token (registry answers 404) instead of exchanging the
          # OIDC identity. npm defaults to registry.npmjs.org anyway.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r run build

      - name: Test
        run: pnpm -r run test

      - name: Publish React package
        if: ${{ inputs.package == 'all' || inputs.package == 'react' }}
        run: |
          # Upgrade in the same shell as the publish: Node 22 ships npm 10.x, which cannot do
          # the OIDC exchange, and an npm installed in an earlier step did not win on PATH
          npm install --global "npm@^11.5.1"
          hash -r
          echo "node $(node --version), npm $(npm --version) at $(which npm)"
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            npm publish --dry-run
          else
            npm publish --provenance --access public
          fi
        working-directory: packages/react

      - name: Publish Proxy package
        if: ${{ inputs.package == 'all' || inputs.package == 'proxy-node' }}
        run: |
          # Upgrade in the same shell as the publish: Node 22 ships npm 10.x, which cannot do
          # the OIDC exchange, and an npm installed in an earlier step did not win on PATH
          npm install --global "npm@^11.5.1"
          hash -r
          echo "node $(node --version), npm $(npm --version) at $(which npm)"
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            npm publish --dry-run
          else
            npm publish --provenance --access public
          fi
        working-directory: packages/proxy-node
