name: Publish to npm (Manual)

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - all
          - react
          - proxy-node
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC identity for npm Trusted Publishing (no NPM_TOKEN)
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version from packageManager in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1; Node 22 still ships npm 10.x
      - name: Use an OIDC-capable npm
        # Pinned to a major: Trusted Publishing needs >= 11.5.1, and `npm@latest` would let a
        # future major change publishing behaviour without a commit here
        run: npm install --global "npm@^11.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r run build

      - name: Test
        run: pnpm -r run test

      - name: Publish React package
        if: ${{ inputs.package == 'all' || inputs.package == 'react' }}
        run: |
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            npm publish --dry-run
          else
            npm publish --provenance --access public
          fi
        working-directory: packages/react

      - name: Publish Proxy package
        if: ${{ inputs.package == 'all' || inputs.package == 'proxy-node' }}
        run: |
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            npm publish --dry-run
          else
            npm publish --provenance --access public
          fi
        working-directory: packages/proxy-node
