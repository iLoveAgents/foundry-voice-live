name: Publish to npm

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v0.2.0, v1.2.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC identity for npm Trusted Publishing: the runner proves which repo and
      # workflow it is, and npm exchanges that for short-lived publish credentials.
      # No NPM_TOKEN is involved — see "Releasing" in AGENTS.md for the one-time npmjs.com setup.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version from packageManager in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          # No `registry-url`: it makes setup-node write an .npmrc pointing at
          # ${NODE_AUTH_TOKEN} and export that variable with a placeholder value, so npm
          # authenticates with a bogus token (registry answers 404) instead of exchanging the
          # OIDC identity. npm defaults to registry.npmjs.org anyway.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r run build

      - name: Test
        run: pnpm -r run test

      # `npm publish`, not `pnpm publish`: the OIDC token exchange is implemented in the
      # npm CLI. Provenance is generated from the same OIDC identity.
      # The upgrade and the publish share one shell on purpose: Node 22 ships npm 10.x, which
      # has no OIDC support, and a global npm installed in an *earlier* step was still not the
      # npm that ran here (the publish reported 10.9.8 and asked for a login).
      - name: Publish to npm
        run: |
          npm install --global "npm@^11.5.1"
          hash -r
          echo "node $(node --version), npm $(npm --version) at $(which npm)"
          (cd packages/react && npm publish --provenance --access public)
          (cd packages/proxy-node && npm publish --provenance --access public)
