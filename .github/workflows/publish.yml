name: Publish to npm

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v0.2.0, v1.2.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC identity for npm Trusted Publishing: the runner proves which repo and
      # workflow it is, and npm exchanges that for short-lived publish credentials.
      # No NPM_TOKEN is involved — see "Releasing" in AGENTS.md for the one-time npmjs.com setup.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version from packageManager in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1; Node 22 still ships npm 10.x
      - name: Use an OIDC-capable npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r run build

      - name: Test
        run: pnpm -r run test

      # `npm publish`, not `pnpm publish`: the OIDC token exchange is implemented in the
      # npm CLI. Provenance is generated from the same OIDC identity.
      - name: Publish React package
        run: npm publish --provenance --access public
        working-directory: packages/react

      - name: Publish Proxy package
        run: npm publish --provenance --access public
        working-directory: packages/proxy-node
